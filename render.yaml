services:
  # Backend API Service
  - type: web
    name: talkai-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: COQUI_TOS_AGREED
        value: "1"
      - key: PORT
        value: "8000"
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: talkai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: talkai-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
